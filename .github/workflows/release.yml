# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs them and their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        id: version
        run: |
          tag="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v heading="## ${RELEASE_TAG#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft-release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The certificate signs the app; the notary profile, "notary" in
      # mygo.json, notarizes its disk image. Both go in a keychain of the
      # job, made the default one, where codesign and notarytool look.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS' && github.repository == 'egoist/mygo-cloudmusic'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      # Forks use the same builder and packages without upstream credentials.
      - name: Configure standalone fork signing
        if: github.repository != 'egoist/mygo-cloudmusic'
        run: |
          jq 'del(.updates, .macos.notarize) | .macos.signingIdentity = "-"' \
            mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          upload=()
          if [ "$GITHUB_REPOSITORY" = egoist/mygo-cloudmusic ]; then upload=(-upload); fi
          go tool mygo build -platform "${{ matrix.platform }}" "${upload[@]}"
      # -upload requires an updater private key. Upload the builder's existing
      # packages directly for standalone forks, keeping assets already published.
      - name: Upload missing fork packages
        if: github.repository != 'egoist/mygo-cloudmusic'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.tag }}
        run: |
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          find build -type f \( -name '*.dmg' -o -name '*-setup-*.exe' \
            -o -name '*.deb' -o -name '*.tar.gz' -o -name install.sh \) -print0 |
          while IFS= read -r -d '' file; do
            if ! grep -Fxq "${file##*/}" <<< "$existing"; then
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file"
              existing+=$'\n'"${file##*/}"
            fi
          done
