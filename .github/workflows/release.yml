# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs them and their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or complete
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        run: test "$RELEASE_TAG" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${RELEASE_TAG#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The certificate signs the app; the notary profile, "notary" in
      # mygo.json, notarizes its disk image. Both go in a keychain of the
      # job, made the default one, where codesign and notarytool look.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS' && github.repository == 'egoist/mygo-cloudmusic'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build and upload
        if: github.repository == 'egoist/mygo-cloudmusic'
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

      # Forks do not own the upstream signing identity or updater key.
      # Only the build copy is changed; upstream releases keep their configuration.
      - name: Configure a standalone fork build
        if: github.repository != 'egoist/mygo-cloudmusic'
        run: |
          jq 'del(.updates, .macos.signingIdentity, .macos.notarize)' mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Check system player regressions
        if: matrix.name == 'macOS' && github.repository != 'egoist/mygo-cloudmusic'
        run: |
          go tool mygo vet .
          go test ./internal/systemplayer ./internal/app ./internal/player -run 'Test(MenuLyrics|ConfigurePresentations|EnvironmentRefresh|SystemPlayer|Marquee|RepeatOneNotifies|LyricsCompletion|WhiteIcon)' -count=5
      - name: Build standalone fork packages
        if: github.repository != 'egoist/mygo-cloudmusic'
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: go tool mygo build -platform "$PLATFORMS" -sign - -skip-notarize
      - name: Package and upload missing assets
        if: github.repository != 'egoist/mygo-cloudmusic'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ matrix.platform }}
        run: |
          version="$(jq -r .version mygo.json)"
          slug="$(jq -r .slug mygo.json)"
          name="$(jq -r .name mygo.json)"
          packages="$RUNNER_TEMP/packages"
          mkdir -p "$packages"
          IFS=',' read -ra targets <<< "$PLATFORMS"
          for target in "${targets[@]}"; do
            directory="build/${target/\//-}"
            if [[ "$target" == darwin/* ]]; then
              codesign --verify --deep --strict "$directory/$name.app"
              ditto -c -k --sequesterRsrc --keepParent "$directory/$name.app" \
                "$directory/$slug-$version-${target#*/}.zip"
            fi
            find "$directory" -maxdepth 1 -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*-setup-*.exe' \
                 -o -name '*.deb' -o -name '*.tar.gz' -o -name 'install.sh' \) \
              -exec cp {} "$packages/" \;
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing-assets"
          for file in "$packages"/*; do
            if grep -Fxq "${file##*/}" "$RUNNER_TEMP/existing-assets"; then
              echo "Keeping existing asset: ${file##*/}"
            else
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file"
            fi
          done

  fork-checksums:
    if: github.repository != 'egoist/mygo-cloudmusic'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Hash the actual release files, including assets retained from an earlier
      # attempt. Only the combined checksum manifest is replaced.
      - name: Update release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*-setup-*.exe' \
            --pattern '*.deb' --pattern '*.tar.gz' --pattern 'install.sh'
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
