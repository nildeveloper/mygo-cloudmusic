# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs them and their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check update signing configuration
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          UPDATE_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || { echo "Missing MYGO_UPDATER_PUBLIC_KEY variable" >&2; exit 1; }
          test -n "$UPDATE_PRIVATE_KEY" || { echo "Missing MYGO_UPDATER_PRIVATE_KEY secret" >&2; exit 1; }
      # Build only the version's tagged commit, even for manual runs.
      - name: Check the version
        id: version
        run: |
          tag="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          # Manual runs must also build the tagged commit, including its notes.
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v heading="## ${RELEASE_TAG#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace an already published release; use a new version/tag" >&2; exit 1;
            }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft-release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # CI builds opt into this repository's feed. Local builds keep the
      # manual Releases link, without any private signing material.
      - name: Configure signed updates
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          jq 'del(.macos.notarize) | .macos.signingIdentity = "-" |
            .updates = {publicKey: env.UPDATE_PUBLIC_KEY, github: env.GITHUB_REPOSITORY, deltas: 0}' \
            mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
          go run ./scripts/sign-update -check
      # Match paste-rs: use the P12 directly, without importing a keychain.
      - name: Prepare rcodesign
        if: matrix.name == 'macOS'
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$SIGNING_P12_BASE64" || { echo "Missing MACOS_SIGNING_P12_BASE64 secret" >&2; exit 1; }
          test -n "$SIGNING_P12_PASSWORD" || { echo "Missing MACOS_SIGNING_P12_PASSWORD secret" >&2; exit 1; }
          umask 077
          signing_dir="$RUNNER_TEMP/mygo-signing"
          mkdir -p "$signing_dir"
          python3 - <<'PY'
          import base64, os
          with open(os.environ["RUNNER_TEMP"] + "/mygo-signing/certificate.p12", "wb") as f:
              f.write(base64.b64decode(os.environ["SIGNING_P12_BASE64"], validate=True))
          PY
          printf '%s' "$SIGNING_P12_PASSWORD" > "$signing_dir/password"
          rcodesign_version="0.29.0"
          rcodesign_sha256="d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d"
          curl -fL --retry 3 \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${rcodesign_version}/apple-codesign-${rcodesign_version}-macos-universal.tar.gz" \
            -o "$signing_dir/rcodesign.tar.gz"
          printf '%s  %s\n' "$rcodesign_sha256" "$signing_dir/rcodesign.tar.gz" | shasum -a 256 -c -
          tar -xzf "$signing_dir/rcodesign.tar.gz" -C "$signing_dir" --strip-components=1
          test -x "$signing_dir/rcodesign"
          "$signing_dir/rcodesign" --version
      - name: Build installers and signed updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build -platform "${{ matrix.platform }}"
      # The builder has already packaged the app. Sign inside a writable copy
      # of each DMG so its Finder layout and volume icon remain intact.
      - name: Sign and verify macOS packages and updates
        if: matrix.name == 'macOS'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          signing_dir="$RUNNER_TEMP/mygo-signing"
          work="$(mktemp -d "$RUNNER_TEMP/mygo-dmg.XXXXXX")"
          mounted=false
          cleanup() {
            if [ "$mounted" = true ]; then hdiutil detach -force "$work/mount" || return; fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          name="$(jq -r .name mygo.json)"
          identifier="$(jq -r .identifier mygo.json)"
          slug="$(jq -r .slug mygo.json)"
          version="$(jq -r .version mygo.json)"
          sign() {
            "$signing_dir/rcodesign" sign \
              --p12-file "$signing_dir/certificate.p12" \
              --p12-password-file "$signing_dir/password" "$1"
          }
          for arch in arm64 amd64; do
            packages=(build/darwin-"$arch"/*.dmg)
            test "${#packages[@]}" = 1
            test -f "${packages[0]}"
            dmg="${packages[0]}"
            hdiutil convert "$dmg" -format UDRW -o "$work/writable.dmg"
            # Certificate signatures need more space than the ad hoc original.
            size_mb="$(( $(stat -f %z "$work/writable.dmg") / 1048576 + 32 ))"
            hdiutil resize -size "${size_mb}m" "$work/writable.dmg"
            mkdir -p "$work/mount"
            hdiutil attach "$work/writable.dmg" -readwrite -nobrowse -noautoopen -mountpoint "$work/mount"
            mounted=true
            app="$work/mount/$name.app"
            sign "$app"
            codesign --verify --deep --strict "$app"
            codesign -d --extract-certificates="$work/certificate-" "$app"
            test -s "$work/certificate-0" # A real certificate, not ad hoc.
            requirement="$(codesign -d -r- "$app" 2>&1)"
            grep -Fq "identifier \"$identifier\"" <<< "$requirement"
            printf '%s\n' "$requirement"
            hdiutil detach "$work/mount"
            mounted=false
            hdiutil convert "$work/writable.dmg" -format ULMO -o "$work/signed.dmg"
            sign "$work/signed.dmg"
            hdiutil verify "$work/signed.dmg"
            codesign --verify --strict "$work/signed.dmg"
            # Validate the actual downloadable image, not only its writable input.
            hdiutil attach "$work/signed.dmg" -readonly -nobrowse -noautoopen -mountpoint "$work/mount"
            mounted=true
            codesign --verify --deep --strict "$app"
            codesign -d --extract-certificates="$work/final-certificate-" "$app"
            cmp "$work/certificate-0" "$work/final-certificate-0"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            expected_arch="$arch"
            if [ "$arch" = amd64 ]; then expected_arch=x86_64; fi
            test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "$expected_arch"
            # Package the app from the verified final DMG, after P12 signing.
            archive="$PWD/build/darwin-$arch/$slug-$version-darwin-$arch.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$archive" -C "$work/mount" "$name.app"
            mkdir "$work/extracted"
            tar -xzf "$archive" -C "$work/extracted"
            codesign --verify --deep --strict "$work/extracted/$name.app"
            cmp "$app/Contents/MacOS/$executable" "$work/extracted/$name.app/Contents/MacOS/$executable"
            rm -rf "$work/extracted"
            go run ./scripts/sign-update \
              -manifest "build/darwin-$arch/update-darwin-$arch.json" -archive "$archive"
            hdiutil detach "$work/mount"
            mounted=false
            mv "$work/signed.dmg" "$dmg"
            rm "$work/writable.dmg" "$work/certificate-"* "$work/final-certificate-"*
          done
      - name: Remove signing credentials
        if: ${{ always() && matrix.name == 'macOS' }}
        run: rm -rf "$RUNNER_TEMP/mygo-signing"
      # Upload archives before manifests. Only draft releases may be rebuilt;
      # clobber both together so a retry cannot leave mismatched signatures.
      - name: Upload release packages and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          find build -type f \( -name '*.dmg' -o -name '*-setup-*.exe' \
            -o -name '*.deb' -o -name '*.tar.gz' -o -name install.sh -o -name install.ps1 \) -print0 |
          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file" --clobber
          done
          find build -type f -name 'update-*.json' -print0 |
          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file" --clobber
          done

  checksums:
    needs: [draft-release, build]
    runs-on: ubuntu-latest
    steps:
      # All platforms must succeed before the draft is ready to publish.
      - name: Verify completeness and update package checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mkdir packages
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir packages \
            --pattern '*.dmg' --pattern '*-setup-*.exe' --pattern '*.deb' \
            --pattern '*.tar.gz' --pattern install.sh --pattern install.ps1 --pattern 'update-*.json'
          for platform in darwin windows linux; do
            for arch in arm64 amd64; do
              manifest="packages/update-$platform-$arch.json"
              test "$(jq -r .version "$manifest")" = "${RELEASE_TAG#v}"
              archive="$(jq -r .url "$manifest")"
              archive="packages/${archive##*/}"
              test "$(stat -c %s "$archive")" = "$(jq -r .size "$manifest")"
            done
          done
          (cd packages && sha256sum *) > SHA256SUMS
          cp SHA256SUMS SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS SHA256SUMS.txt --clobber
